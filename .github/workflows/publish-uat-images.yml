name: Publish UAT Images to GHCR

on:
  push:
    tags:
      - "uat-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "New immutable UAT image tag, for example uat-v1.2.3 (never reuse)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-uat-images-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: clickhouse-uat
            context: .
            dockerfile: clickhouse/Dockerfile.uat
          - image: dbt-runner-uat
            context: dbt
            dockerfile: dbt/Dockerfile
          - image: serving-api-uat
            context: .
            dockerfile: api/Dockerfile
          - image: source-mssql-init
            context: datasources
            dockerfile: datasources/Dockerfile.mssql-init
          - image: source-mongodb
            context: datasources
            dockerfile: datasources/Dockerfile.mongodb
          - image: prometheus-uat
            context: monitoring/prometheus
            dockerfile: monitoring/prometheus/Dockerfile.uat
          - image: grafana-uat
            context: monitoring/grafana
            dockerfile: monitoring/grafana/Dockerfile.uat
          - image: loki-uat
            context: monitoring/loki
            dockerfile: monitoring/loki/Dockerfile.uat

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve and validate immutable tag
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
              echo "Manual publishing is allowed only from the default branch: ${DEFAULT_BRANCH}" >&2
              echo "Selected branch: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            release_tag="${DISPATCH_TAG}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${release_tag}" =~ ^uat-v[0-9]+\.[0-9]+\.[0-9]+([._-][a-z0-9.-]+)?$ ]]; then
            echo "release_tag must match uat-v<major>.<minor>.<patch>[-suffix]" >&2
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_ref="ghcr.io/${owner}/${{ matrix.image }}:${release_tag}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Reject an existing immutable image tag
        shell: bash
        run: |
          image_ref="${{ steps.release.outputs.image_ref }}"
          if docker manifest inspect "${image_ref}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing immutable image: ${image_ref}" >&2
            echo "Choose a new release tag and run the workflow from the approved Git ref." >&2
            exit 1
          fi

      - name: Validate ClickHouse configuration policy
        if: matrix.image == 'clickhouse-uat'
        shell: bash
        run: python governance/policy_linter.py

      - name: Set up isolated Buildx builder
        shell: bash
        run: |
          docker buildx create \
            --name uat-publisher \
            --driver docker-container \
            --use
          docker buildx inspect --bootstrap

      - name: Build image candidate
        shell: bash
        run: |
          docker buildx build \
            --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --file "${{ matrix.dockerfile }}" \
            --tag "${{ steps.release.outputs.image_ref }}" \
            --load \
            "${{ matrix.context }}"

      - name: Smoke-test image candidate
        shell: bash
        run: |
          image_ref="${{ steps.release.outputs.image_ref }}"

          case "${{ matrix.image }}" in
            clickhouse-uat)
              docker run --rm --entrypoint clickhouse "${image_ref}" \
                extract-from-config \
                --config-file=/etc/clickhouse-server/config.xml \
                --key=http_port
              ;;
            serving-api-uat)
              docker run --rm \
                --entrypoint python \
                --env CLICKHOUSE_API_PASSWORD=validation-only \
                "${image_ref}" \
                -c "import main; from data_quality.reconciliation import DataReconciliationEngine; DataReconciliationEngine()"
              ;;
            source-mssql-init)
              docker run --rm --entrypoint /bin/bash "${image_ref}" \
                -n /opt/lakehouse/init-mssql-source.sh
              ;;
            source-mongodb)
              docker run --rm --entrypoint mongosh "${image_ref}" --version
              ;;
          esac

      - name: Publish tested image
        shell: bash
        run: |
          docker push "${{ steps.release.outputs.image_ref }}"

      - name: Verify published manifest
        shell: bash
        run: |
          docker buildx imagetools inspect "${{ steps.release.outputs.image_ref }}"
