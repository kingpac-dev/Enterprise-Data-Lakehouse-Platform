name: Publish UAT Images to GHCR

on:
  push:
    tags:
      - "uat-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "New immutable UAT image tag, for example uat-v1.2.3 (never reuse)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-uat-images-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: clickhouse-uat
            context: .
            dockerfile: clickhouse/Dockerfile.uat
          - image: dbt-runner-uat
            context: dbt
            dockerfile: dbt/Dockerfile
          - image: serving-api-uat
            context: .
            dockerfile: api/Dockerfile
          - image: source-mssql-init
            context: datasources
            dockerfile: datasources/Dockerfile.mssql-init
          - image: source-mongodb
            context: datasources
            dockerfile: datasources/Dockerfile.mongodb
          - image: prometheus-uat
            context: monitoring/prometheus
            dockerfile: monitoring/prometheus/Dockerfile.uat
          - image: grafana-uat
            context: monitoring/grafana
            dockerfile: monitoring/grafana/Dockerfile.uat
          - image: loki-uat
            context: monitoring/loki
            dockerfile: monitoring/loki/Dockerfile.uat

    env:
      MINIO_SMOKE_IMAGE: ${{ vars.MINIO_SMOKE_IMAGE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve and validate immutable tag
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
              echo "Manual publishing is allowed only from the default branch: ${DEFAULT_BRANCH}" >&2
              echo "Selected branch: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            release_tag="${DISPATCH_TAG}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${release_tag}" =~ ^uat-v[0-9]+\.[0-9]+\.[0-9]+([._-][a-z0-9.-]+)?$ ]]; then
            echo "release_tag must match uat-v<major>.<minor>.<patch>[-suffix]" >&2
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_ref="ghcr.io/${owner}/${{ matrix.image }}:${release_tag}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Reject an existing immutable image tag
        shell: bash
        run: |
          image_ref="${{ steps.release.outputs.image_ref }}"
          if docker manifest inspect "${image_ref}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing immutable image: ${image_ref}" >&2
            echo "Choose a new release tag and run the workflow from the approved Git ref." >&2
            exit 1
          fi

      - name: Validate ClickHouse configuration policy
        if: matrix.image == 'clickhouse-uat'
        shell: bash
        run: python governance/policy_linter.py

      - name: Set up isolated Buildx builder
        shell: bash
        run: |
          docker buildx create \
            --name uat-publisher \
            --driver docker-container \
            --use
          docker buildx inspect --bootstrap

      - name: Build image candidate
        shell: bash
        run: |
          docker buildx build \
            --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --file "${{ matrix.dockerfile }}" \
            --tag "${{ steps.release.outputs.image_ref }}" \
            --load \
            "${{ matrix.context }}"

      - name: Smoke-test image candidate
        shell: bash
        run: |
          image_ref="${{ steps.release.outputs.image_ref }}"

          case "${{ matrix.image }}" in
            clickhouse-uat)
              smoke_suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              smoke_network="clickhouse-smoke-${smoke_suffix}"
              minio_container="clickhouse-smoke-minio-${smoke_suffix}"
              smoke_container="clickhouse-smoke-${smoke_suffix}"
              minio_image="quay.io/minio/minio:RELEASE.2024-08-17T01-24-54Z@sha256:6f23072e3e222e64fe6f86b31a7f7aca971e5129e55cbccef649b109b8e651a1"
              clickhouse_s3_endpoint="http://${minio_container}:9000/validation/clickhouse_data/"

              cleanup_clickhouse_smoke() {
                docker rm -f "${smoke_container}" >/dev/null 2>&1 || true
                docker rm -f "${minio_container}" >/dev/null 2>&1 || true
                docker network rm "${smoke_network}" >/dev/null 2>&1 || true
              }
              trap cleanup_clickhouse_smoke EXIT

              docker network create "${smoke_network}"
              docker run --detach \
                --name "${minio_container}" \
                --network "${smoke_network}" \
                --env MINIO_ROOT_USER=validation-access-key \
                --env MINIO_ROOT_PASSWORD=validation-secret-key \
                "${minio_image}" \
                server /data

              minio_ready=false
              for _ in $(seq 1 60); do
                if docker exec "${minio_container}" \
                  mc alias set smoke http://127.0.0.1:9000 \
                    validation-access-key validation-secret-key >/dev/null 2>&1 && \
                  docker exec "${minio_container}" \
                    mc ready smoke >/dev/null 2>&1; then
                  minio_ready=true
                  break
                fi

                if [[ "$(docker inspect --format '{{.State.Running}}' "${minio_container}")" != "true" ]]; then
                  break
                fi
                sleep 1
              done

              if [[ "${minio_ready}" != "true" ]]; then
                echo 'MinIO did not become ready; startup logs follow.' >&2
                docker logs "${minio_container}" >&2 || true
                exit 1
              fi

              docker exec "${minio_container}" \
                mc mb --ignore-existing smoke/validation

              clickhouse_validation_env=(
                --env CLICKHOUSE_USER=admin
                --env CLICKHOUSE_PASSWORD=validation-admin-password
                --env CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
                --env CLICKHOUSE_SKIP_USER_SETUP=1
                --env CLICKHOUSE_INIT_TIMEOUT=180
                --env CLICKHOUSE_ADMIN_PASSWORD=validation-admin-password
                --env CLICKHOUSE_ETL_PASSWORD=validation-etl-password
                --env CLICKHOUSE_BI_PASSWORD=validation-bi-password
                --env CLICKHOUSE_API_PASSWORD=validation-api-password
                --env CLICKHOUSE_MONITORING_PASSWORD=validation-monitoring-password
                --env "CLICKHOUSE_S3_ENDPOINT=${clickhouse_s3_endpoint}"
                --env CLICKHOUSE_S3_ACCESS_KEY=validation-access-key
                --env CLICKHOUSE_S3_SECRET_KEY=validation-secret-key
                --env S3_REGION=us-east-1
              )
              docker run --rm --entrypoint sh "${image_ref}" -c \
                'grep -R -n "from_env=" /etc/clickhouse-server/config.d /etc/clickhouse-server/users.d'
              docker run --rm --entrypoint clickhouse \
                "${clickhouse_validation_env[@]}" \
                "${image_ref}" \
                extract-from-config \
                --config-file=/etc/clickhouse-server/config.xml \
                --key=http_port
              docker run --rm --entrypoint clickhouse \
                "${clickhouse_validation_env[@]}" \
                "${image_ref}" \
                extract-from-config \
                --config-file=/etc/clickhouse-server/config.xml \
                --key=storage_configuration.disks.s3_cold.endpoint |
                grep -Fx "${clickhouse_s3_endpoint}"

              docker run --detach \
                --name "${smoke_container}" \
                --network "${smoke_network}" \
                --ulimit nofile=262144:262144 \
                "${clickhouse_validation_env[@]}" \
                "${image_ref}"

              clickhouse_ready=false
              for _ in $(seq 1 180); do
                pid1_command="$(docker exec "${smoke_container}" sh -c \
                  'tr "\000" " " < /proc/1/cmdline' 2>/dev/null || true)"

                # During initdb the entrypoint starts a loopback-only temporary
                # server. Do not accept that process as a successful smoke test;
                # PID 1 must have exec'd the final clickhouse-server first.
                if [[ "${pid1_command}" == *clickhouse-server* ]] && \
                  docker exec "${smoke_container}" \
                  clickhouse-client \
                    --host 127.0.0.1 \
                    --user admin \
                    --password validation-admin-password \
                    --query 'SELECT 1' >/dev/null 2>&1; then
                  clickhouse_ready=true
                  break
                fi

                if [[ "$(docker inspect --format '{{.State.Running}}' "${smoke_container}")" != "true" ]]; then
                  break
                fi
                sleep 1
              done

              if [[ "${clickhouse_ready}" != "true" ]]; then
                echo 'ClickHouse did not become ready; startup logs follow.' >&2
                docker inspect "${smoke_container}" >&2 || true
                docker exec "${smoke_container}" sh -c \
                  'printf "PID 1: "; tr "\000" " " < /proc/1/cmdline; printf "\n"' >&2 || true
                docker exec "${smoke_container}" sh -c \
                  'tail -n 200 /var/log/clickhouse-server/clickhouse-server.err.log' >&2 || true
                docker logs "${smoke_container}" >&2 || true
                exit 1
              fi

              docker exec "${smoke_container}" \
                clickhouse-client \
                  --host 127.0.0.1 \
                  --user admin \
                  --password validation-admin-password \
                  --query 'SELECT currentUser(), version()'
              cleanup_clickhouse_smoke
              trap - EXIT
              ;;
            serving-api-uat)
              docker run --rm \
                --entrypoint python \
                --env CLICKHOUSE_API_PASSWORD=validation-only \
                "${image_ref}" \
                -c "import main; from data_quality.reconciliation import DataReconciliationEngine; DataReconciliationEngine()"
              ;;
            source-mssql-init)
              docker run --rm --entrypoint /bin/bash "${image_ref}" \
                -n /opt/lakehouse/init-mssql-source.sh
              ;;
            source-mongodb)
              docker run --rm --entrypoint mongosh "${image_ref}" --version
              ;;
          esac

      - name: Publish tested image
        shell: bash
        run: |
          docker push "${{ steps.release.outputs.image_ref }}"

      - name: Verify published manifest
        shell: bash
        run: |
          docker buildx imagetools inspect "${{ steps.release.outputs.image_ref }}"
