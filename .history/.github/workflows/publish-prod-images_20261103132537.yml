name: Publish PROD Single-Node Image to GHCR

# Configure the production-images environment with required reviewers, restrict
# it to the default branch, and set the approved base-image variable before use.
# Deploy by the resulting digest. Publishing does not deploy a stack.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "New immutable image tag (prod-v<major>.<minor>.<patch>); never reuse"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-prod-images-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-scan-publish:
    name: Build, scan and publish ClickHouse single-node image
    runs-on: ubuntu-24.04
    environment: production-images
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CLICKHOUSE_BASE_IMAGE: ${{ vars.APPROVED_CLICKHOUSE_BASE_IMAGE }}
      MINIO_SMOKE_IMAGE: ${{ vars.MINIO_SMOKE_IMAGE }}

    steps:
      - name: Checkout approved source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate release inputs and approved base image
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "Select the default branch (${DEFAULT_BRANCH}) for manual publishing." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^prod-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'release_tag must match prod-v<major>.<minor>.<patch>.' >&2
            exit 1
          fi
          if [[ ! "${CLICKHOUSE_BASE_IMAGE}" =~ :26\.8\.[0-9]+\.[0-9]+@sha256:[a-f0-9]{64}$ ]]; then
            echo 'APPROVED_CLICKHOUSE_BASE_IMAGE must pin a ClickHouse 26.8 patch and sha256 digest.' >&2
            exit 1
          fi
          if [[ -z "${MINIO_SMOKE_IMAGE}" ]]; then
            echo 'MINIO_SMOKE_IMAGE variable is not set in the production-images environment.' >&2
            echo 'Set vars.MINIO_SMOKE_IMAGE to a digest-pinned MinIO image (e.g. docker.io/minio/minio:RELEASE.2024-08-17T01-24-54Z@sha256:<digest>).' >&2
            exit 1
          fi
          if [[ ! "${MINIO_SMOKE_IMAGE}" =~ @sha256:[a-f0-9]{64}$ ]]; then
            echo 'MINIO_SMOKE_IMAGE must be pinned by sha256 digest.' >&2
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_ref="ghcr.io/${owner}/clickhouse-prod-single:${RELEASE_TAG}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Validate ClickHouse configuration policy
        run: python governance/policy_linter.py

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Reject an existing image tag
        shell: bash
        env:
          IMAGE_REF: ${{ steps.release.outputs.image_ref }}
        run: |
          if docker manifest inspect "${IMAGE_REF}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image tag: ${IMAGE_REF}" >&2
            exit 1
          fi

      - name: Ensure default Docker buildx driver
        shell: bash
        run: |
          # GitHub-hosted runners may pre-configure a docker-container driver
          # whose --load behaviour silently fails to populate the local daemon.
          # Force the default (docker) driver so --load works reliably.
          docker buildx use default 2>/dev/null || true
          echo "--- Active buildx builder ---"
          docker buildx ls | head -10

      - name: Build image candidate
        shell: bash
        env:
          IMAGE_REF: ${{ steps.release.outputs.image_ref }}
        run: |
          docker buildx build \
            --pull \
            --build-arg "CLICKHOUSE_BASE_IMAGE=${CLICKHOUSE_BASE_IMAGE}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --file clickhouse/Dockerfile.prod-single \
            --tag "${IMAGE_REF}" \
            --load .

          # Fail fast if --load did not populate the local Docker daemon.
          # Without this guard the smoke-test silently attempts a registry pull
          # for an image that has not been pushed yet, producing a misleading
          # "manifest unknown / access not authorized" error.
          echo "--- Verifying image was loaded into local Docker daemon ---"
          if ! docker image inspect "${IMAGE_REF}" > /dev/null 2>&1; then
            echo "::error::Image ${IMAGE_REF} was NOT loaded into the local Docker daemon." >&2
            echo "Buildx driver state:" >&2
            docker buildx ls >&2
            exit 1
          fi
          echo "Image confirmed in local daemon: $(docker image inspect --format '{{.Id}}' "${IMAGE_REF}")"

      - name: Smoke-test ClickHouse image
        shell: bash
        env:
          IMAGE_REF: ${{ steps.release.outputs.image_ref }}
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network="prod-image-smoke-${suffix}"
          minio="prod-image-minio-${suffix}"
          clickhouse="prod-image-clickhouse-${suffix}"
          minio_image='quay.io/minio/minio:RELEASE.2024-08-17T01-24-54Z@sha256:6f23072e3e222e64fe6f86b31a7f7aca971e5129e55cbccef649b109b8e651a1'
          access_key="smoke$(openssl rand -hex 12)"
          secret_key="$(openssl rand -hex 24)"
          admin_password="$(openssl rand -hex 24)"
          endpoint="http://${minio}:9000/validation/clickhouse_data/"
          cleanup() {
            docker rm -f "${clickhouse}" "${minio}" >/dev/null 2>&1 || true
            docker network rm "${network}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "${network}"
          docker run --detach --name "${minio}" --network "${network}" \
            --env "MINIO_ROOT_USER=${access_key}" \
            --env "MINIO_ROOT_PASSWORD=${secret_key}" \
            "${minio_image}" server /data
          ready=false
          for _ in $(seq 1 60); do
            if docker exec "${minio}" mc alias set smoke http://127.0.0.1:9000 \
                 "${access_key}" "${secret_key}" >/dev/null 2>&1 && \
               docker exec "${minio}" mc ready smoke >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "${ready}" != true ]]; then
            echo 'MinIO did not become ready.' >&2
            exit 1
          fi
          docker exec "${minio}" mc mb --ignore-existing smoke/validation
          validation_env=(
            --env CLICKHOUSE_USER=admin
            --env "CLICKHOUSE_PASSWORD=${admin_password}"
            --env CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
            --env CLICKHOUSE_SKIP_USER_SETUP=1
            --env CLICKHOUSE_INIT_TIMEOUT=180
            --env "CLICKHOUSE_ADMIN_PASSWORD=${admin_password}"
            --env "CLICKHOUSE_ETL_PASSWORD=${admin_password}"
            --env "CLICKHOUSE_BI_PASSWORD=${admin_password}"
            --env "CLICKHOUSE_API_PASSWORD=${admin_password}"
            --env "CLICKHOUSE_MONITORING_PASSWORD=${admin_password}"
            --env "CLICKHOUSE_S3_ENDPOINT=${endpoint}"
            --env "CLICKHOUSE_S3_ACCESS_KEY=${access_key}"
            --env "CLICKHOUSE_S3_SECRET_KEY=${secret_key}"
            --env S3_REGION=us-east-1
          )
          docker run --rm --entrypoint clickhouse "${validation_env[@]}" "${IMAGE_REF}" \
            extract-from-config --config-file=/etc/clickhouse-server/config.xml \
            --key=storage_configuration.disks.s3_cold.endpoint | grep -Fx "${endpoint}"
          docker run --detach --name "${clickhouse}" --network "${network}" \
            --ulimit nofile=262144:262144 "${validation_env[@]}" "${IMAGE_REF}"
          ready=false
          for _ in $(seq 1 180); do
            pid1="$(docker exec "${clickhouse}" sh -c 'tr "\000" " " < /proc/1/cmdline' 2>/dev/null || true)"
            if [[ "${pid1}" == *clickhouse-server* ]] &&
               docker exec "${clickhouse}" clickhouse-client --host 127.0.0.1 \
                 --user admin --password "${admin_password}" --query 'SELECT 1' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "${ready}" != true ]]; then
            echo 'ClickHouse did not complete initialization or become ready.' >&2
            exit 1
          fi
          docker exec "${clickhouse}" clickhouse-client --host 127.0.0.1 \
            --user admin --password "${admin_password}" \
            --query 'SELECT currentUser(), version()'

      - name: Scan candidate for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.release.outputs.image_ref }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Publish scanned image
        shell: bash
        env:
          IMAGE_REF: ${{ steps.release.outputs.image_ref }}
        run: docker push "${IMAGE_REF}"

      - name: Verify published manifest
        shell: bash
        env:
          IMAGE_REF: ${{ steps.release.outputs.image_ref }}
        run: docker buildx imagetools inspect "${IMAGE_REF}"
