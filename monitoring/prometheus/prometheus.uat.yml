global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: clickhouse-uat
    metrics_path: /metrics
    static_configs:
      - targets: ["clickhouse:9363"]
        labels:
          environment: uat
          role: analytics-engine

  - job_name: minio-uat
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
        labels:
          environment: uat
          role: lake-storage
