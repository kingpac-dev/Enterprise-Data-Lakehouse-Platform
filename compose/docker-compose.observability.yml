name: enterprise-lakehouse-observability

# ==============================================================================
# Standalone Observability Stack (Prometheus, Grafana, Loki)
# Can be run on a dedicated management host or alongside DEV/UAT
# ==============================================================================

networks:
  observability:
    external: true
    name: ${OBSERVABILITY_NETWORK:-lakehouse-uat-observability}
  management:
    driver: bridge

volumes:
  prometheus_prod_data:
  grafana_prod_data:
  loki_prod_data:

services:
  # ----------------------------------------------------------------------------
  # Prometheus Metrics Engine
  # ----------------------------------------------------------------------------
  prometheus:
    image: lakehouse/prometheus-uat:2.54.0
    pull_policy: build
    build:
      context: ../monitoring/prometheus
      dockerfile: Dockerfile.uat
    container_name: lakehouse-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-19093}:9090"
    volumes:
      - prometheus_prod_data:/prometheus
    networks:
      - observability
    restart: always

  # ----------------------------------------------------------------------------
  # Grafana Visualization & Dashboards
  # ----------------------------------------------------------------------------
  grafana:
    image: lakehouse/grafana-uat:11.1.4
    pull_policy: build
    build:
      context: ../monitoring/grafana
      dockerfile: Dockerfile.uat
    container_name: lakehouse-grafana
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource"
    volumes:
      - grafana_prod_data:/var/lib/grafana
    networks:
      - observability
      - management
    restart: always

  # ----------------------------------------------------------------------------
  # Loki Structured Log Aggregation
  # ----------------------------------------------------------------------------
  loki:
    image: lakehouse/loki-uat:3.1.1
    pull_policy: build
    build:
      context: ../monitoring/loki
      dockerfile: Dockerfile.uat
    container_name: lakehouse-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT:-13100}:3100"
    volumes:
      - loki_prod_data:/loki
    networks:
      - observability
    restart: always
