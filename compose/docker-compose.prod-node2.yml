name: enterprise-lakehouse-prod-node2

# ==============================================================================
# PROD Node 2: ClickHouse Replica 02 + ClickHouse Keeper 02
# Deployed on Host 02 (Independent failure domain)
# ==============================================================================

networks:
  data_backend:
    driver: bridge
  data_storage:
    driver: bridge
  observability:
    driver: bridge
  management:
    driver: bridge

volumes:
  clickhouse_node2_data:
  clickhouse_node2_logs:
  keeper_node2_data:
  portainer_agent_data:

services:
  # ----------------------------------------------------------------------------
  # Keeper Member 2 (Coordination Quorum)
  # ----------------------------------------------------------------------------
  keeper-02:
    image: ${KEEPER_PROD_IMAGE:?Set an approved 26.8 patch image digest}
    container_name: lakehouse-keeper-02
    ports:
      - "${HOST_NODE2_IP:?Set approved private Node 2 IP}:9181:9181"   # Client port
      - "${HOST_NODE2_IP:?Set approved private Node 2 IP}:9234:9234"   # Raft peer port
    environment:
      KEEPER_SERVER_ID: 2
    extra_hosts:
      - "keeper-01:${HOST_NODE1_IP:?Set approved private Node 1 IP}"
      - "keeper-02:${HOST_NODE2_IP:?Set approved private Node 2 IP}"
      - "keeper-03:${HOST_NODE3_IP:?Set approved private Node 3 IP}"
      - "clickhouse-01:${HOST_NODE1_IP:?Set approved private Node 1 IP}"
      - "clickhouse-02:${HOST_NODE2_IP:?Set approved private Node 2 IP}"
    volumes:
      - keeper_node2_data:/var/lib/clickhouse-keeper
      - ../clickhouse/config.d/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    networks:
      - data_backend
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ----------------------------------------------------------------------------
  # ClickHouse Server Replica 2
  # ----------------------------------------------------------------------------
  clickhouse-02:
    image: ${CLICKHOUSE_PROD_IMAGE:?Set an approved 26.8 patch image digest}
    container_name: lakehouse-clickhouse-02
    depends_on:
      keeper-02:
        condition: service_healthy
    ports:
      - "${HOST_NODE2_IP:?Set approved private Node 2 IP}:8123:8123"   # HTTP
      - "${HOST_NODE2_IP:?Set approved private Node 2 IP}:9000:9000"   # Native TCP
      - "${HOST_NODE2_IP:?Set approved private Node 2 IP}:9009:9009"   # Interserver data replication sync
      - "${HOST_NODE2_IP:?Set approved private Node 2 IP}:9363:9363"   # Prometheus Metrics
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_SKIP_USER_SETUP: ${CLICKHOUSE_SKIP_USER_SETUP:-1}
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_ETL_PASSWORD: ${CLICKHOUSE_ETL_PASSWORD}
      CLICKHOUSE_BI_PASSWORD: ${CLICKHOUSE_BI_PASSWORD}
      CLICKHOUSE_API_PASSWORD: ${CLICKHOUSE_API_PASSWORD}
      CLICKHOUSE_MONITORING_PASSWORD: ${CLICKHOUSE_MONITORING_PASSWORD}
      CLICKHOUSE_SHARD: "1"
      CLICKHOUSE_REPLICA: "2"
      CLICKHOUSE_S3_ENDPOINT: ${CLICKHOUSE_S3_ENDPOINT}
      CLICKHOUSE_S3_ACCESS_KEY: ${CLICKHOUSE_S3_ACCESS_KEY}
      CLICKHOUSE_S3_SECRET_KEY: ${CLICKHOUSE_S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
    extra_hosts:
      - "keeper-01:${HOST_NODE1_IP:?Set approved private Node 1 IP}"
      - "keeper-02:${HOST_NODE2_IP:?Set approved private Node 2 IP}"
      - "keeper-03:${HOST_NODE3_IP:?Set approved private Node 3 IP}"
      - "clickhouse-01:${HOST_NODE1_IP:?Set approved private Node 1 IP}"
      - "clickhouse-02:${HOST_NODE2_IP:?Set approved private Node 2 IP}"
    volumes:
      - clickhouse_node2_data:/var/lib/clickhouse
      - clickhouse_node2_logs:/var/log/clickhouse-server
      - ../clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ../clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - ../sql/init/01_databases.sql:/docker-entrypoint-initdb.d/01_databases.sql:ro
      - ../sql/init/02_medallion_tables.sql:/docker-entrypoint-initdb.d/02_medallion_tables.sql:ro
      - ../sql/init/03_materialized_views.sql:/docker-entrypoint-initdb.d/03_materialized_views.sql:ro
      - ../sql/init/04_rbac_and_row_policies.sql:/docker-entrypoint-initdb.d/04_rbac_and_row_policies.sql:ro
      - ../sql/init/05_kafka_streaming.sql:/docker-entrypoint-initdb.d/05_kafka_streaming.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          cpus: "16"
          memory: "64G"
        reservations:
          memory: "32G"
    networks:
      - data_backend
      - data_storage
      - observability
      - management
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ----------------------------------------------------------------------------
  # Portainer Agent
  # ----------------------------------------------------------------------------
  portainer-agent:
    profiles: ["agent"]
    image: ${PORTAINER_AGENT_PROD_IMAGE:?Set an approved Portainer Agent image digest}
    container_name: portainer-agent-node2
    ports:
      - "${HOST_NODE2_IP:?Set approved private Node 2 IP}:9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - management
    restart: always
