name: enterprise-lakehouse-prod-node2

# ==============================================================================
# PROD Node 2: ClickHouse Replica 02 + ClickHouse Keeper 02
# Deployed on Host 02 (Independent failure domain)
# ==============================================================================

networks:
  data_backend:
    driver: bridge
  data_storage:
    driver: bridge
  observability:
    driver: bridge
  management:
    driver: bridge

volumes:
  clickhouse_node2_data:
  clickhouse_node2_logs:
  keeper_node2_data:
  portainer_agent_data:

services:
  # ----------------------------------------------------------------------------
  # Keeper Member 2 (Coordination Quorum)
  # ----------------------------------------------------------------------------
  keeper-02:
    image: clickhouse/clickhouse-keeper:26.8-alpine
    container_name: lakehouse-keeper-02
    ports:
      - "9181:9181"   # Client port
      - "9234:9234"   # Raft peer port
    volumes:
      - keeper_node2_data:/var/lib/clickhouse-keeper
      - ../clickhouse/config.d/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    networks:
      - data_backend
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ----------------------------------------------------------------------------
  # ClickHouse Server Replica 2
  # ----------------------------------------------------------------------------
  clickhouse-02:
    image: clickhouse/clickhouse-server:26.8
    container_name: lakehouse-clickhouse-02
    depends_on:
      keeper-02:
        condition: service_healthy
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native TCP
      - "9363:9363"   # Prometheus Metrics
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_node2_data:/var/lib/clickhouse
      - clickhouse_node2_logs:/var/log/clickhouse-server
      - ../clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ../clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - ../sql/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          cpus: "16"
          memory: "64G"
        reservations:
          memory: "32G"
    networks:
      - data_backend
      - data_storage
      - observability
      - management
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ----------------------------------------------------------------------------
  # Portainer Agent
  # ----------------------------------------------------------------------------
  portainer-agent:
    image: portainer/agent:2.21.0
    container_name: portainer-agent-node2
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - management
    restart: always
