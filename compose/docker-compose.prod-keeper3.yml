name: enterprise-lakehouse-prod-keeper3

# ==============================================================================
# PROD Node 3: ClickHouse Keeper 03 (Tie-breaker for 3-node Raft Quorum)
# Deployed on Host 03 (Independent failure domain)
# ==============================================================================

networks:
  data_backend:
    driver: bridge
  management:
    driver: bridge

volumes:
  keeper_node3_data:
  portainer_agent_data:

services:
  # ----------------------------------------------------------------------------
  # Keeper Member 3 (Quorum Tie-Breaker)
  # ----------------------------------------------------------------------------
  keeper-03:
    image: ${KEEPER_PROD_IMAGE:?Set an approved 26.8 patch image digest}
    container_name: lakehouse-keeper-03
    ports:
      - "${HOST_NODE3_IP:?Set approved private Node 3 IP}:9181:9181"   # Client port
      - "${HOST_NODE3_IP:?Set approved private Node 3 IP}:9234:9234"   # Raft peer port
    environment:
      KEEPER_SERVER_ID: 3
    extra_hosts:
      - "keeper-01:${HOST_NODE1_IP:?Set approved private Node 1 IP}"
      - "keeper-02:${HOST_NODE2_IP:?Set approved private Node 2 IP}"
      - "keeper-03:${HOST_NODE3_IP:?Set approved private Node 3 IP}"
      - "clickhouse-01:${HOST_NODE1_IP:?Set approved private Node 1 IP}"
      - "clickhouse-02:${HOST_NODE2_IP:?Set approved private Node 2 IP}"
    volumes:
      - keeper_node3_data:/var/lib/clickhouse-keeper
      - ../clickhouse/config.d/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    networks:
      - data_backend
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ----------------------------------------------------------------------------
  # Portainer Agent
  # ----------------------------------------------------------------------------
  portainer-agent:
    profiles: ["agent"]
    image: ${PORTAINER_AGENT_PROD_IMAGE:?Set an approved Portainer Agent image digest}
    container_name: portainer-agent-node3
    ports:
      - "${HOST_NODE3_IP:?Set approved private Node 3 IP}:9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - management
    restart: always
