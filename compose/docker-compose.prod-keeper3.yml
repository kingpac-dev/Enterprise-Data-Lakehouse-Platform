name: enterprise-lakehouse-prod-keeper3

# ==============================================================================
# PROD Node 3: ClickHouse Keeper 03 (Tie-breaker for 3-node Raft Quorum)
# Deployed on Host 03 (Independent failure domain)
# ==============================================================================

networks:
  data_backend:
    driver: bridge
  management:
    driver: bridge

volumes:
  keeper_node3_data:
  portainer_agent_data:

services:
  # ----------------------------------------------------------------------------
  # Keeper Member 3 (Quorum Tie-Breaker)
  # ----------------------------------------------------------------------------
  keeper-03:
    image: clickhouse/clickhouse-keeper:26.8-alpine
    container_name: lakehouse-keeper-03
    ports:
      - "9181:9181"   # Client port
      - "9234:9234"   # Raft peer port
    environment:
      KEEPER_SERVER_ID: 3
    extra_hosts:
      - "keeper-01:${HOST_NODE1_IP:-127.0.0.1}"
      - "keeper-02:${HOST_NODE2_IP:-127.0.0.1}"
      - "keeper-03:${HOST_NODE3_IP:-127.0.0.1}"
      - "clickhouse-01:${HOST_NODE1_IP:-127.0.0.1}"
      - "clickhouse-02:${HOST_NODE2_IP:-127.0.0.1}"
    volumes:
      - keeper_node3_data:/var/lib/clickhouse-keeper
      - ../clickhouse/config.d/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    networks:
      - data_backend
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ----------------------------------------------------------------------------
  # Portainer Agent
  # ----------------------------------------------------------------------------
  portainer-agent:
    image: portainer/agent:2.21.0
    container_name: portainer-agent-node3
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - management
    restart: always
