name: enterprise-lakehouse-uat-core

# ==============================================================================
# DEV / UAT Single-Host Stack (Evaluation & Benchmark Baseline)
# NOTE: This single-host topology is NOT high availability (HA).
# ==============================================================================

networks:
  data_backend:
    name: ${INTEGRATION_NETWORK:-lakehouse-uat-integration}
    external: true
  data_storage:
    driver: bridge
  observability:
    name: ${OBSERVABILITY_NETWORK:-lakehouse-uat-observability}
    external: true

volumes:
  clickhouse_dev_data:
  clickhouse_dev_logs:
  minio_dev_data:
  rustfs_dev_data:

services:
  # ----------------------------------------------------------------------------
  # 1. S3-Compatible Lake Storage (MinIO)
  # ----------------------------------------------------------------------------
  minio:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest@sha256:3c60a2a8c4d33409a9bc7a623a7fcbfb4605adc3d89422d2f53b3f673a6e5597}
    container_name: lakehouse-minio
    # Keep the container listener fixed; only the host-side published port varies.
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-lakehouse_s3_access_key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-lakehouse_s3_secret_change_me}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "${S3_PORT:-19090}:9000"
      - "${MINIO_CONSOLE_PORT:-19091}:9001"
    volumes:
      - minio_dev_data:/data
    networks:
      - data_storage
      - observability
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Bucket Initializer for Lakehouse Medallion Paths
  minio-init:
    image: ${MINIO_MC_IMAGE:-cgr.dev/chainguard/minio-client:latest-dev@sha256:39768db4c3fa811bc8f2e2a3e0add8ea391648b1c980de179985e1c353dc1805}
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY:-lakehouse_s3_access_key} ${S3_SECRET_KEY:-lakehouse_s3_secret_change_me};
      mc mb --ignore-existing myminio/${S3_BUCKET_LAKE:-enterprise-data-lake};
      mc anonymous set none myminio/${S3_BUCKET_LAKE:-enterprise-data-lake};
      echo 'MinIO buckets initialized successfully.';
      exit 0;
      "
    networks:
      - data_storage

  # ----------------------------------------------------------------------------
  # Optional S3-Compatible Storage: RustFS (enable profile: rustfs)
  # ----------------------------------------------------------------------------
  rustfs-permissions:
    profiles: ["rustfs"]
    image: alpine:3.20.3
    container_name: lakehouse-rustfs-permissions
    user: root
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - rustfs_dev_data:/data
    restart: "no"

  rustfs:
    profiles: ["rustfs"]
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff}
    container_name: lakehouse-rustfs
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_HEALTH_ENDPOINT_ENABLE: "true"
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-change_this_rustfs_access_key}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-change_this_rustfs_secret_key}
      RUSTFS_OBS_LOGGER_LEVEL: ${RUSTFS_LOG_LEVEL:-info}
    ports:
      - "${RUSTFS_PORT:-19094}:9000"
      - "${RUSTFS_CONSOLE_PORT:-19095}:9001"
    volumes:
      - rustfs_dev_data:/data
    networks:
      - data_backend
      - observability
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health/ready && curl -fsS http://127.0.0.1:9001/rustfs/console/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "${RUSTFS_CPU_LIMIT:-2}"
          memory: "${RUSTFS_MEMORY_LIMIT:-2G}"
    restart: unless-stopped

  rustfs-init:
    profiles: ["rustfs"]
    image: ${MINIO_MC_IMAGE:-cgr.dev/chainguard/minio-client:latest-dev@sha256:39768db4c3fa811bc8f2e2a3e0add8ea391648b1c980de179985e1c353dc1805}
    container_name: lakehouse-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set rustfs http://rustfs:9000 ${RUSTFS_ACCESS_KEY:-change_this_rustfs_access_key} ${RUSTFS_SECRET_KEY:-change_this_rustfs_secret_key};
      mc mb --ignore-existing rustfs/${RUSTFS_BUCKET_LAKE:-enterprise-data-lake-rustfs};
      mc anonymous set none rustfs/${RUSTFS_BUCKET_LAKE:-enterprise-data-lake-rustfs};
      echo 'RustFS bucket initialized successfully.';
      exit 0;
      "
    networks:
      - data_backend

  # ----------------------------------------------------------------------------
  # 2. ClickHouse Analytics & Serving Engine (26.8 LTS)
  # ----------------------------------------------------------------------------
  clickhouse:
    image: ${CLICKHOUSE_UAT_IMAGE:?Set CLICKHOUSE_UAT_IMAGE to a prebuilt registry image}
    pull_policy: missing
    container_name: lakehouse-clickhouse-dev
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "${CLICKHOUSE_PORT_HTTP:-18123}:8123"
      - "${CLICKHOUSE_PORT_NATIVE:-19000}:9000"
      - "${CLICKHOUSE_PORT_PROMETHEUS:-19363}:9363"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-change_this_admin_password_in_prod}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: ${CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT:-1}
      # users.d/users.xml owns admin/service users and removes the default user.
      CLICKHOUSE_SKIP_USER_SETUP: ${CLICKHOUSE_SKIP_USER_SETUP:-1}
      # Set to 1 only for an approved recovery of a partially initialized UAT volume.
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: ${CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS:-}
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-change_this_admin_password_in_prod}
      CLICKHOUSE_ETL_PASSWORD: ${CLICKHOUSE_ETL_PASSWORD:-change_this_etl_password_in_prod}
      CLICKHOUSE_BI_PASSWORD: ${CLICKHOUSE_BI_PASSWORD:-change_this_bi_password_in_prod}
      CLICKHOUSE_API_PASSWORD: ${CLICKHOUSE_API_PASSWORD:-change_this_api_password_in_prod}
      CLICKHOUSE_MONITORING_PASSWORD: ${CLICKHOUSE_MONITORING_PASSWORD:-change_this_monitoring_password_in_prod}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lakehouse_s3_access_key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lakehouse_s3_secret_change_me}
      S3_REGION: ${S3_REGION:-us-east-1}
      CLICKHOUSE_S3_ENDPOINT: ${CLICKHOUSE_S3_ENDPOINT:-http://minio:9000/${S3_BUCKET_LAKE:-enterprise-data-lake}/clickhouse_data/}
      CLICKHOUSE_S3_ACCESS_KEY: ${CLICKHOUSE_S3_ACCESS_KEY:-${S3_ACCESS_KEY:-lakehouse_s3_access_key}}
      CLICKHOUSE_S3_SECRET_KEY: ${CLICKHOUSE_S3_SECRET_KEY:-${S3_SECRET_KEY:-lakehouse_s3_secret_change_me}}
    volumes:
      - clickhouse_dev_data:/var/lib/clickhouse
      - clickhouse_dev_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          cpus: "${CLICKHOUSE_CPU_LIMIT:-4}"
          memory: "${CLICKHOUSE_MEMORY_LIMIT:-8G}"
        reservations:
          memory: "${CLICKHOUSE_MEMORY_RESERVATION:-4G}"
    networks:
      - data_backend
      - data_storage
      - observability
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --host 127.0.0.1
          --user "$${CLICKHOUSE_USER}"
          --password "$${CLICKHOUSE_PASSWORD}"
          --query "SELECT 1" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 3. Data Transformation: dbt-runner (On-Demand Profile)
  # ----------------------------------------------------------------------------
  dbt-runner:
    profiles: ["tools"]
    image: ${DBT_RUNNER_UAT_IMAGE:?Set DBT_RUNNER_UAT_IMAGE to a prebuilt registry image}
    pull_policy: missing
    container_name: lakehouse-dbt-runner
    depends_on:
      - clickhouse
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT_NATIVE: 9000
      CLICKHOUSE_ADMIN_USER: ${CLICKHOUSE_ADMIN_USER:-admin}
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-change_this_admin_password_in_prod}
    networks:
      - data_backend

  # ----------------------------------------------------------------------------
  # 4. Serving REST API Microservice (On-Demand Profile)
  # ----------------------------------------------------------------------------
  serving-api:
    profiles: ["api"]
    image: ${SERVING_API_UAT_IMAGE:?Set SERVING_API_UAT_IMAGE to a prebuilt registry image}
    pull_policy: missing
    container_name: lakehouse-serving-api
    depends_on:
      - clickhouse
    ports:
      - "${SERVING_API_PORT:-18000}:8000"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT_HTTP: 8123
      CLICKHOUSE_API_USER: api_user
      CLICKHOUSE_API_PASSWORD: ${CLICKHOUSE_API_PASSWORD:-change_this_api_password_in_prod}
    networks:
      - data_backend
    restart: unless-stopped
