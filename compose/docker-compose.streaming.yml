# ==============================================================================
# Enterprise Data Lakehouse Platform - Real-Time Streaming Stack (M02)
# ==============================================================================
# Architecture: Redpanda (Kafka-compatible, ultra-low footprint, zero-ZooKeeper)
# + Redpanda Console (Real-time message & consumer inspection UI)
# ==============================================================================

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.14
    container_name: lakehouse-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://${REDPANDA_ADVERTISED_HOST:-localhost}:${REDPANDA_PORT_KAFKA:-19092}
    ports:
      - "${REDPANDA_PORT_KAFKA:-19092}:9092"
      - "${REDPANDA_PORT_ADMIN:-19644}:9644"
    networks:
      - integration
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      # rpk returns exit code 0 only after the cluster is healthy. Avoid parsing
      # human-readable output such as "Healthy: true", which changes by version.
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: lakehouse-redpanda-console
    environment:
      KAFKA_BROKERS: "redpanda:29092"
    ports:
      - "${REDPANDA_CONSOLE_PORT:-18088}:8080"
    networks:
      - integration
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

networks:
  integration:
    name: ${INTEGRATION_NETWORK:-lakehouse-uat-integration}
    external: true

volumes:
  redpanda_data:
    name: lakehouse-redpanda-data
